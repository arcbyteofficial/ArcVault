version: '3.8'

services:
  app:
    build: .
    container_name: arcvault-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Set this to the connection string of the PostgreSQL instance you created in Dokploy
      - DATABASE_URL=${DATABASE_URL}
      - DB_REQUIRE_SSL=false
      # Add other necessary environment variables below
      # - JWT_SECRET=${JWT_SECRET}
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
